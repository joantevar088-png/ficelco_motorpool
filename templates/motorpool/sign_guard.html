{% extends 'base.html' %}
{% block title %}Guard Clearance{% endblock %}
{% block page_title %}✅ Cleared By — Guard on Duty{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-shield-check text-primary"></i> Clearance: Guard on Duty
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info mb-4">
                    <strong>Request #{{ req.id }}</strong><br>
                    <small>{{ req.destination_full }}</small>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label"><strong>Guard Name</strong></label>
                        <input type="text" name="guard_on_duty_name" class="form-control"
                               value="{{ user.get_full_name|default:user.username }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><strong>Date & Time</strong></label>
                        <input type="text" class="form-control" value="{% now 'F d, Y g:i A' %}" readonly>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-shield-check"></i> Clear Vehicle
                        </button>
                        <a href="{% url 'request_detail' req.id %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
